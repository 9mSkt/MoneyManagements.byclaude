<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(${form.id == null} ? #{goal.new} : #{goal.edit}, ~{::content}, ~{})}">
<body>
<section th:fragment="content" class="stack narrow">
    <div class="card">
        <div class="card-head">
            <h2 th:text="${form.id == null} ? #{goal.new} : #{goal.edit}">New goal</h2>
            <a class="link-small" th:href="@{/goals}" th:text="#{goal.back}">Back</a>
        </div>
        <div class="alert error" th:if="${!#maps.isEmpty(errors)}" th:text="#{form.error.check}" role="alert">Check.</div>

        <form th:action="@{/goals}" method="post" th:object="${form}">
            <input type="hidden" th:field="*{id}">
            <div class="field" th:classappend="${errors.containsKey('name')} ? 'has-error'">
                <label for="name" th:text="#{goal.name}">Name</label>
                <input class="input" id="name" th:field="*{name}" maxlength="200" required autocomplete="off"
                       th:placeholder="#{goal.name.example}">
                <div class="field-error" th:if="${errors.containsKey('name')}" th:text="#{${errors.get('name')}}">Error</div>
            </div>
            <div class="form-row">
                <div class="field" th:classappend="${errors.containsKey('target')} ? 'has-error'">
                    <label for="target" th:text="#{goal.target}">Target</label>
                    <div class="money-input">
                        <span aria-hidden="true">฿</span>
                        <input class="input" id="target" th:field="*{target}" inputmode="decimal" required autocomplete="off" maxlength="20">
                    </div>
                    <div class="field-error" th:if="${errors.containsKey('target')}" th:text="#{${errors.get('target')}}">Error</div>
                </div>
                <div class="field" th:classappend="${errors.containsKey('saved')} ? 'has-error'">
                    <label for="saved" th:text="#{goal.saved}">Saved so far</label>
                    <div class="money-input">
                        <span aria-hidden="true">฿</span>
                        <input class="input" id="saved" th:field="*{saved}" inputmode="decimal" autocomplete="off" maxlength="20">
                    </div>
                    <div class="field-error" th:if="${errors.containsKey('saved')}" th:text="#{${errors.get('saved')}}">Error</div>
                </div>
            </div>
            <div class="field" th:classappend="${errors.containsKey('deadline')} ? 'has-error'">
                <label for="deadline" th:text="#{goal.deadline}">Deadline (optional)</label>
                <input class="input" id="deadline" type="date" th:field="*{deadline}">
                <div class="field-error" th:if="${errors.containsKey('deadline')}" th:text="#{${errors.get('deadline')}}">Error</div>
            </div>
            <div class="field" th:classappend="${errors.containsKey('note')} ? 'has-error'">
                <label for="note" th:text="#{tx.note}">Note</label>
                <textarea class="input" id="note" th:field="*{note}" rows="2" maxlength="500"></textarea>
                <div class="field-error" th:if="${errors.containsKey('note')}" th:text="#{${errors.get('note')}}">Error</div>
            </div>
            <div class="actions">
                <button type="submit" class="btn" th:text="#{tx.save}">Save</button>
                <a class="btn secondary" th:href="@{/goals}" th:text="#{form.cancel}">Cancel</a>
            </div>
        </form>
    </div>

    <form th:if="${form.id != null}" class="card danger-zone" th:action="@{/goals/{id}/delete(id=${form.id})}"
          method="post" th:attr="data-confirm=#{goal.delete.confirm}">
        <div class="grow">
            <strong th:text="#{goal.delete}">Delete goal</strong>
            <div class="muted small" th:text="#{goal.delete.desc}">Transactions stay.</div>
        </div>
        <button type="submit" class="btn danger" th:text="#{tx.delete}">Delete</button>
    </form>
</section>
</body>
</html>
