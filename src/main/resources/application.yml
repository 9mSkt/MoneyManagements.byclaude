spring:
  application:
    name: money-management
  profiles:
    default: local
  config:
    # Local secrets (APP_USERNAME, APP_PASSWORD_HASH, ...) live in a git-ignored .env file.
    import: optional:file:.env[.properties]
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  thymeleaf:
    cache: true

server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
  error:
    whitelabel:
      enabled: false

app:
  username: ${APP_USERNAME:}
  password-hash: ${APP_PASSWORD_HASH:}
  security:
    max-failed-logins: 5
    lockout-minutes: 15
  salary:
    # Salary day (the 28th, or the last weekday before it at a weekend). Income imported from a sheet month tab
    # is dated on that month's payday. Income always counts toward the month it is received in. 0 = the 1st.
    payday: 28
